<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#b40000'><style>:root{font-family:Arial,sans-serif;color:#222;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#b40000;color:white;padding:16px 18px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.sub{opacity:.9}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:700;margin:10px 0 6px}input,select,textarea,button{width:100%;font-size:16px;padding:12px;border:1px solid #ccd0d5;border-radius:10px}textarea{min-height:110px;resize:vertical}button{border:0;background:#b40000;color:white;font-weight:700;margin-top:10px}.secondary{background:#4b5563}.danger{background:#7f1d1d}.ghost{background:#e5e7eb;color:#111}.progress{height:10px;background:#ddd;border-radius:99px;overflow:hidden}.bar{height:100%;background:#b40000}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px;font-size:13px}.photo{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#666}.ok{background:#ecfdf5;border:1px solid #10b981;padding:10px;border-radius:10px}.warn{background:#fff7ed;border:1px solid #f97316;padding:10px;border-radius:10px}.bad{background:#fef2f2;border:1px solid #ef4444;padding:10px;border-radius:10px}h2,h3{margin-top:4px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.checkrow button{width:auto;margin:0;padding:8px 10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.instruction{background:#fff7e6;border:1px solid #e2b85b;border-radius:12px;padding:14px 16px;margin:10px 0 20px;line-height:1.45}.instruction-title{font-weight:800;font-size:14px;letter-spacing:.04em;margin-bottom:7px}</style><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="AutoZone Audit">
<meta name="apple-mobile-web-app-title" content="AutoZone Audit"><title>AutoZone Branch Audit</title></head><body><header><div class='brand'>AUTOZONE</div><div class='sub'>Branch Audit</div></header><main id='app'></main><script>const DEFAULT_CHECKS=[
{id:'PC010',name:'Pettycash Stamped',cell:'M10',sheet:'PETTYCASH STAMPED',description:'Ensure that the petty cash float allocation details obtained from the regional bookkeeper corresponds to the actual floats in the branch.  Perform a spot check on the petty cash and till floats to identify potential misuse / abuse / discrepancies.  Ensure petty cash vouchers match supplier invoices and all completed transactions are stamped "PAID\'. Identify branches that do not submit their PC timeously.'},
{id:'BO015',name:'Buy-Outs',cell:'M15',sheet:'BUY-OUTS',description:'Review the buy-out file and ensure that the supplier invoice reflects the AutoZone order number (pre-printed / hand written).  Ensure that a copy of the ERP invoice is attached to the supplier invoice or that the ERP invoice number is recorded on the supplier invoice & compare details and quantities to ensure it corresponds.  Ensure that the order document was signed by the team members ordering and authorizing the buyout and attached to the buyout pack.  Compare the details to the buyout report.'},
{id:'SI017',name:'Supplier Invoice Check',cell:'M17',sheet:'SUPPLIER INV CHECK',description:'Are the Supplier invoices readily available and properly filed?  Extract a COA report and compare items and pricing captured to supplier invoices for correctness. Compare ATR date to captured date - report on reasons for delays in capturing.'},
{id:'TS022',name:'Tripsheets Check',cell:'M22',sheet:'TRIPSHEETS CHECK',description:'When COD money is collected by the driver, the driver’s trip sheet must be signed by both the driver and the customer. The responsible person receiving the cash must sign the driver’s trip sheet when money is received from the driver. Ensure that the monetary value of the sale is noted on the driver’s trip sheet.'},
{id:'FS023',name:'Fuel Sheet',cell:'M23',sheet:'FUEL SHEET',description:'Ensure that the Branch manager is completing the fuel consumption report for each vehicle used, which should be compared to the fuel statement at the end of the month. Also ensure that the branch is utilizing the vehicle checklist sheet at least once a week.'},
{id:'AV029',name:'Adjustment Verification',cell:'M29',sheet:'ADJUSTMENT VERIFICATION',description:'Do a sample check on parts credited against the stock adjustment report. If stock was written off, investigate further who the sales person was and the reason for the adjustments.  Ensure credits are checked against the daily Credit Note report and signed off.'},
{id:'CR030',name:'Credit Note Request',cell:'M30',sheet:'CREDIT NOTE REQUEST',description:'Verify if the credit note request document was completed in full prior to the credit being passed ie for cash, COD, account customers. Also ensure that the cash refund section on the cash credit note is completed in full and signed by the customer in acknowledging receipt of their refund received.'},
{id:'CS031',name:'Claim Shelf',cell:'M31',sheet:'CLAIM SHELF',description:'Determine whether claims are kept separately from other stock items on a shelf marked "CLAIMS" and accompanied by supporting documentation. Check whether claims are reviewed and signed off by the ROM / Senior Branch Manager.  Have import claims that\'s been signed off been destroyed?  Determine what has happened to the scrap metal? If money has been paid to the branch for scrap metal / boxes it has to be paid into the AutoZone sundry account.'},
{id:'MB040',name:'Manual Book Check',cell:'M40',sheet:'MANUAL BOOK CHECK',description:'Ensure all manual books were booked out into the stationery control register. Ensure that each sales representative is only allocated one book each at any given time. Establish if manual invoices are completed in full and not shared between sales representatives.'},
{id:'EI041',name:'ERP Invoice Check',cell:'M41',sheet:'ERP INVOICE CHECK',description:'Verify if the second and third copies of manual invoices agree to the ERP invoice and is the ERP invoice attached thereto noting part number, quantity, amount and cross referencing of manual invoice number and processed within 24 hours. Ensure branch manager signs as proof of review.'},
{id:'AL044',name:'Alarm Check',cell:'M44',sheet:'ALARM CHECK',description:'Verify that the alarm system is tested weekly. Check to see if the store opening / closing times correspond with the regular trading hours?  (Obtain activity report). Is the alarm check register up to date including alarm codes by user?  Are there multiple Key Holders as responders to activated alarms.  Who are the keyholders.  Verify with security company on calling procedures.'},
{id:'AR046',name:'Attendance Register',cell:'M46',sheet:'ATTENDANCE REGISTER',description:'Check that all staff members including Branch Manager consistently complete their timesheets or attendance registers correctly in accordance with established requirements.'},
{id:'KR047',name:'Key Register',cell:'M47',sheet:'KEY REGISTER',description:'Is the key control register up to date?  All the keys of the store should be signed out to the relevant team members. (Shop keys, safe keys, petty cash box keys + spare, holders of alarm codes / remotes, vehicle keys - spare, vehicle tags, emergency doors, drop safe keys + spare, internal doors and cabinets keys)'},
{id:'OH050',name:'OHASA',cell:'M50',sheet:'OHASA',description:'Are all relevant OHASA team members appointed and have they received the necessary training in first aid and fire fighting.  Also ensure that the branch have a health and safety representative and that regular meetings are held?'},
{id:'OP051',name:'OHS Equity Posters',cell:'M51',sheet:'OHS EQUITY POSTERS',description:'Ensure the following documentation is displayed in the branch: Basic conditions of employment act, Occupational Health and Safety act, Employment equity Act and the regulations around safety.  Also ensure the branch have a ethics hotline poster displayed.'},
{id:'FE055',name:'Fire Extinguishers',cell:'M55',sheet:'FIRE EXTINGUISHERS',description:'Are fire extinguishers correctly mounted and have these extinguishers been serviced in line with the dates indicated thereon?  Does the branch have enough fire extinguishers in the branch.'}];
const K='az_audit_v3', CK='az_checks_v4'; let checks=JSON.parse(localStorage.getItem(CK)||'null')||DEFAULT_CHECKS; let audit=JSON.parse(localStorage.getItem(K)||'null'); let current=0;
const app=document.getElementById('app'); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(K,JSON.stringify(audit))} function saveChecks(){localStorage.setItem(CK,JSON.stringify(checks))}
function visitId(branch){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${branch}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function home(){app.innerHTML=`<div class=card><h2>Branch Audit <span class='small'>PWA V1.2</span></h2><button onclick="newAudit()">NEW AUDIT</button>${audit?'<button class=secondary onclick="resume()">CONTINUE AUDIT</button>':''}</div><div class=card><h3>Safety controls</h3><div class=ok>Excel import must match the app Branch Code to <b>Index!H2</b>.</div><div class=ok style='margin-top:8px'>Each visit has a unique Visit ID. A previously imported Visit ID must be blocked by Excel.</div></div>`}
function newAudit(){app.innerHTML=`<div class=card><h2>Start New Audit</h2><label>Branch Code</label><input id=branch maxlength=10 placeholder='e.g. FBI' autocapitalize=characters><label>Auditor</label><input id=auditor placeholder='Auditor name'><label>Visit Date</label><input id=date type=date value='${new Date().toISOString().slice(0,10)}'><button onclick="start()">START AUDIT</button><button class=ghost onclick="home()">BACK</button></div>`}
function start(){let b=document.getElementById('branch').value.trim().toUpperCase(),a=document.getElementById('auditor').value.trim(),d=document.getElementById('date').value;if(!b||!a||!d)return alert('Enter branch code, auditor and date.');audit={branch:b,auditor:a,date:d,visitId:visitId(b),created:new Date().toISOString(),answers:{},completed:false};save();current=0;screen()}
function resume(){current=0;screen()}
function screen(){let c=checks[current],ans=audit.answers[c.id]||{rating:'',notes:'',photos:[]};let done=checks.filter(x=>audit.answers[x.id]?.rating).length,pct=Math.round(done/checks.length*100);app.innerHTML=`<div class=card><div class=small>${esc(audit.branch)} • ${esc(audit.visitId)}</div><div class=progress><div class=bar style='width:${pct}%'></div></div><div class=small>${done} of ${checks.length} completed (${pct}%)</div></div><div class=card><div class=small>Check ${current+1} of ${checks.length} • ${esc(c.cell)} • ${esc(c.id)}</div><h2>${esc(c.name)}</h2><div class=instruction><div class=instruction-title>WHAT TO CHECK</div><div>${esc(c.description||'')}</div></div><label>Rating / Result</label><select id=rating><option value=''>Select...</option><option>Non Compliant</option><option>Partly Compliant</option><option>Fully Compliant</option><option>#N/A</option></select><label>Notes</label><textarea id=notes placeholder='Enter audit notes...'>${esc(ans.notes)}</textarea><label>Photo evidence</label><input id=photos type=file accept='image/*' capture='environment' multiple onchange='addSelectedPhotos()'><div id=photostatus class=small style='margin-top:8px'></div><div id=plist></div><button onclick="saveCurrent()">SAVE CHECK</button><div class=nav><button class=secondary onclick="prev()">← PREVIOUS</button><button onclick="next()">NEXT →</button></div><button class=ghost onclick="summary()">AUDIT SUMMARY</button></div>`;document.getElementById('rating').value=ans.rating;renderPhotos(ans)}
function renderPhotos(ans){document.getElementById('plist').innerHTML=(ans.photos||[]).map((p,i)=>`<div class=photo><span>📷 ${esc(p.name)} <span class=small>(${Math.round((p.size||0)/1024)} KB)</span></span><button class=danger onclick="removePhoto(${i})">X</button></div>`).join('')}
const DBNAME='az_audit_photos_v3', STORE='photos';
function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open(DBNAME,1);q.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=e=>rej(e.target.error)})}
async function dbPut(rec){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=()=>{db.close();res()};tx.onerror=e=>{db.close();rej(e.target.error)}})}
async function dbGet(id){let db=await dbOpen();return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).get(id);q.onsuccess=()=>{db.close();res(q.result)};q.onerror=e=>{db.close();rej(e.target.error)}})}
async function dbDel(id){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=e=>{db.close();rej(e.target.error)}})}
function compressImage(file,maxDim=1600,quality=.72){return new Promise((res,rej)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxDim/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{URL.revokeObjectURL(u);blob?res(blob):rej(new Error('Could not compress photo'))},'image/jpeg',quality)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read photo'))};img.src=u})}
async function addSelectedPhotos(){let inp=document.getElementById('photos'),fs=[...inp.files];if(!fs.length)return;let c=checks[current],a=audit.answers[c.id]||{rating:'',notes:'',photos:[]};a.rating=document.getElementById('rating').value;a.notes=document.getElementById('notes').value;a.photos=a.photos||[];audit.answers[c.id]=a;save();let status=document.getElementById('photostatus');status.textContent='Saving photo evidence...';try{for(const f of fs){let blob=await compressImage(f);let id=`${audit.visitId}_${c.id}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;await dbPut({id,blob,name:f.name||'photo.jpg',type:'image/jpeg',created:new Date().toISOString()});a.photos.push({id,name:f.name||'photo.jpg',size:blob.size,type:'image/jpeg'});audit.answers[c.id]=a;save()}status.textContent=`${a.photos.length} photo(s) attached`;inp.value='';renderPhotos(a)}catch(e){status.textContent='Photo could not be saved. Please try again.';alert('Photo save error: '+e.message)}}
async function saveCurrent(noRender=false){let c=checks[current],old=audit.answers[c.id]||{photos:[]};audit.answers[c.id]={rating:document.getElementById('rating').value,notes:document.getElementById('notes').value,photos:old.photos||[]};save();if(!noRender)screen()}
async function removePhoto(i){let c=checks[current],a=audit.answers[c.id];if(a&&a.photos&&a.photos[i]){let p=a.photos[i];try{await dbDel(p.id)}catch(e){}a.photos.splice(i,1);save();screen()}}
async function next(){await saveCurrent(true);if(current<checks.length-1){current++;screen()}else summary()} function prev(){if(current>0){current--;screen()}}
function goToCheck(id){let i=checks.findIndex(c=>c.id===id);if(i>=0){current=i;screen()}}
function summary(){let done=checks.filter(x=>audit.answers[x.id]?.rating).length,non=checks.filter(x=>audit.answers[x.id]?.rating==='Non Compliant').length,miss=checks.filter(x=>!audit.answers[x.id]?.rating),missing=miss.length;let missingHtml=missing?`<div style="margin-top:18px"><b>Checks still to complete:</b>${miss.map(c=>`<button class="ghost" style="text-align:left;margin-top:8px" onclick="goToCheck('${c.id}')">⚠ ${esc(c.name)} <span class="small">(${esc(c.id)})</span></button>`).join('')}</div>`:'';let actions=missing?'<button onclick="screen()">RETURN TO CHECKS</button>':'<button onclick="sendAudit()">SEND AUDIT</button><button class="ghost" onclick="downloadAudit()">DOWNLOAD BACKUP</button>';app.innerHTML=`<div class=card><h2>Audit Summary</h2><div class='${missing?'warn':'ok'}'><b>${done}/${checks.length}</b> checks completed</div><p>Non Compliant: <b>${non}</b><br>Incomplete: <b>${missing}</b></p>${missingHtml}<p class=small>Branch: ${esc(audit.branch)}<br>Visit ID: ${esc(audit.visitId)}<br>Auditor: ${esc(audit.auditor)}</p>${actions}<button class=ghost onclick="home()">HOME</button></div>`}
function bytesToB64(bytes){let bin='',step=0x8000;for(let i=0;i<bytes.length;i+=step)bin+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(bin)}
function textB64(t){return bytesToB64(new TextEncoder().encode(t||''))}
async function blobB64(blob){return bytesToB64(new Uint8Array(await blob.arrayBuffer()))}
async function buildAuditFile(){
  let lines=[
    'AZAUDIT|5','BRANCH|'+textB64(audit.branch),'VISITID|'+textB64(audit.visitId),
    'AUDITDATE|'+textB64(audit.date),'AUDITOR|'+textB64(audit.auditor),'EXPORTED|'+textB64(new Date().toISOString())
  ];
  for(const c of checks){let ans=audit.answers[c.id]||{};lines.push(['CHECK',textB64(c.id),textB64(c.name),textB64(c.cell),textB64(c.sheet),textB64(ans.rating||''),textB64(ans.notes||'')].join('|'));for(const meta of (ans.photos||[])){let rec=await dbGet(meta.id);if(rec&&rec.blob)lines.push(['PHOTO',textB64(c.id),textB64(meta.name||'photo.jpg'),textB64(meta.type||'image/jpeg'),await blobB64(rec.blob)].join('|'))}}
  lines.push('END|'+textB64(audit.visitId));
  let name=`${audit.branch}_${audit.visitId}.azaudit`;
  return {blob:new Blob([lines.join('\n')],{type:'application/octet-stream'}),name};
}
async function sendAudit(){
  try{
    let f=await buildAuditFile(), file=new File([f.blob],f.name,{type:'application/octet-stream'});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:`AutoZone Audit ${audit.branch}`,text:`Branch ${audit.branch} | Visit ${audit.visitId}`,files:[file]});
      audit.completed=true;save();
    }else{
      alert('Your browser cannot share the audit file directly from this local test page. The audit will be downloaded instead. You can then share it from Downloads using WhatsApp or email.');
      await downloadAudit();
    }
  }catch(e){if(e && e.name==='AbortError')return;alert('Share could not open. The audit will be downloaded as a backup.');await downloadAudit()}
}
async function downloadAudit(){let f=await buildAuditFile(),u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);audit.completed=true;save()}
function manage(){app.innerHTML=`<div class=card><h2>Manage Checks</h2><p class=small>Only checks listed here appear in the app. Add/remove future VBA-created evidence checks here.</p><div id=clist>${checks.map((c,i)=>`<div class=checkrow><div><b>${esc(c.name)}</b><div class=small>${esc(c.cell)} • ${esc(c.sheet)}</div></div><button class=danger onclick="delCheck(${i})">DELETE</button></div>`).join('')}</div><button onclick="addCheck()">ADD CHECK</button><button class=ghost onclick="home()">BACK</button></div>`}
function delCheck(i){if(confirm('Remove this check from the app?')){checks.splice(i,1);saveChecks();manage()}}
function addCheck(){let name=prompt('Check name:');if(!name)return;let cell=prompt('Checklist result cell, e.g. M60:');if(!cell)return;let sheet=prompt('Evidence sheet name:');if(!sheet)return;let id='C'+Date.now().toString().slice(-6);checks.push({id,name,cell:cell.toUpperCase(),sheet});saveChecks();manage()}
home();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW registration:', err));
  });
}
</script></body></html>
